buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.0.12077973"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        maven {
            url("$rootDir/../node_modules/@react-native-async-storage/async-storage/android/local_repo")
        }
    }
}
// =============================================================================
// Fix: Force all subprojects to use the same Kotlin stdlib version
// This prevents version mismatch errors with third-party libraries
// =============================================================================
subprojects {
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin') {
                details.useVersion rootProject.ext.kotlinVersion
            }
        }
    }
}

// =============================================================================
// Fix: Node.js not found when running from Android Studio
// Android Studio doesn't inherit terminal PATH, so we need to explicitly set it
// =============================================================================
// Fix: Node.js detection for both POSIX and Windows
def nodePath = "node"
def nodeDir = ""

if (System.getProperty("os.name").toLowerCase().contains("windows")) {
    // On Windows, 'where' is used to find the executable path
    try {
        def process = "where node".execute()
        process.waitFor()
        if (process.exitValue() == 0) {
            nodePath = process.text.trim().split("\n")[0].trim()
            nodeDir = new File(nodePath).parent
        }
    } catch (Exception e) {
        // Fallback to default PATH if 'where' fails
    }
} else {
    // POSIX logic
    def commonPaths = ["/opt/homebrew/bin/node", "/usr/local/bin/node", "/usr/bin/node"]
    for (path in commonPaths) {
        if (file(path).exists()) {
            nodePath = path
            nodeDir = new File(path).parent
            break
        }
    }
}

// Set NODE_BINARY globally so React Native gradle plugin can find it
ext.NODE_BINARY = nodePath

// Fix PATH for codegen tasks using taskGraph
gradle.taskGraph.whenReady { taskGraph ->
    def pathSeparator = System.getProperty("os.name").toLowerCase().contains("windows") ? ";" : ":"
    def fullPath = (nodeDir ? "${nodeDir}${pathSeparator}" : "") + (System.getProperty("os.name").toLowerCase().contains("windows") ? "" : "/usr/local/bin${pathSeparator}/usr/bin${pathSeparator}") + (System.getenv("PATH") ?: "")
    taskGraph.allTasks.each { task ->
        if (task.class.name.contains("Exec")) {
            task.environment("PATH", fullPath)
            task.environment("NODE_BINARY", nodePath)
        }
    }
}
